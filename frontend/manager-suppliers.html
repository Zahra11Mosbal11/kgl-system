<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers - Manager Dashboard</title>
    <link rel="stylesheet" href="styles/manager-dashboard.css" />
    <link rel="stylesheet" href="styles/client.css" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page container-fluid">
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <a href="manager-dashboard.html" class="nav-item">
            <img src="assets/icons/Rectangle 2804.svg" alt="" />
            <span>Dashboard</span>
          </a>
          <a href="manager-inventory.html" class="nav-item">
            <img src="assets/icons/inventory.svg" alt="" />
            <span>Inventory</span>
          </a>
          <a href="manager-sales.html" class="nav-item">
            <img src="assets/icons/sales.svg" alt="" />
            <span>Sales</span>
          </a>
          <a href="manager-purchases.html" class="nav-item">
            <img src="assets/icons/checklist 1.svg" alt="" />
            <span>Purchases</span>
          </a>
          <a href="manager-suppliers.html" class="nav-item active">
            <img src="assets/icons/suppliers.svg" alt="" />
            <span>Suppliers</span>
          </a>
          <a href="manager-reports.html" class="nav-item">
            <img src="assets/icons/report.svg" alt="" />
            <span>Reports</span>
          </a>
          <a href="director-user-management.html" class="nav-item">
            <img src="assets/icons/store.svg" alt="" />
            <span>User Management</span></a
          >
          <div class="settings-logout">
            <a href="settings.html" class="nav-item">
            <img src="assets/icons/settings.svg" alt="" />
            <span>Settings</span></a
          >
          <a href="#" class="nav-item" id="logoutBtn">
            <img src="assets/icons/log_out.svg" alt="" />
            <span>Log Out</span></a
          ></div>
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <div class="header-user-info">
            <h2 id="welcomeMsg">User <span>(Role)</span></h2>
            <div class="d-flex align-items-center gap-2">
              <p id="branchName" class="text-muted small mb-0"></p>
              <select id="branchSelector" class="form-select form-select-sm" style="width: auto; display: none;">
                <option value="All">All Branches</option>
                <option value="Maganjo">Maganjo</option>
                <option value="Matugga">Matugga</option>
              </select>
            </div>
          </div>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
            <img src="assets/icons/suppliers.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="main-content-body">
            <div class="tabal-header">
                <button
                class="gold-btn btn btn-warning"
                style="height: 50px; background-color: #dcaf48; color: white; border: none;"
                onclick="fetchModal('modal/supplier.html')"
                >
                Add New Supplier
                </button>
                
                <div class="filter-buttons">
                    <input
                    type="text"
                    id="supplierSearch"
                    placeholder="Search..."
                    class="search-input"
                    />
                    <button class="filter-btn active" data-filter="all">
                    All
                    </button>
                    <button class="filter-btn" data-filter="active">
                    Active
                    </button>
                    <button class="filter-btn" data-filter="inactive">
                    Inactive
                    </button>
                </div>
            </div>

            <div class="table-section loading" style="padding: 20px;">
                <table class="clients-table">
                    <thead>
                        <tr>
                            <th>Supplier Name</th>
                            <th>Phone</th>
                            <th>Products Supplied</th>
                            <th>Status</th>
                            <th>Last Delivery</th>
                        </tr>
                    </thead>
                    <tbody id="suppliersTableBody">
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
      </div>
    </div>



    <div id="modal-container"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/supplier-form.js"></script>
    <script src="js/manager-suppliers.js"></script>
  </body>
</html>
