<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Purchase Reports - Manager Dashboard</title>
    <link rel="stylesheet" href="styles/sales-agent-dashboard.css" />
    
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .filters-section {
        background: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      }
      
      .filters-row {
        display: flex;
        gap: 20px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      
      .filter-group {
        flex: 1;
        min-width: 200px;
      }
      
      .filter-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
      }
      
      .filter-group input,
      .filter-group select {
        width: 100%;
        padding: 10px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }
      
      .filter-group input:focus,
      .filter-group select:focus {
        outline: none;
        border-color: #dcaf48;
        box-shadow: 0 0 0 3px rgba(175, 155, 76, 0.1);
      }
      
      .date-range {
        display: flex;
        gap: 10px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <!-- Sidebar injected by js/sidebar-common.js -->
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <div class="header-user-info"><h2 id="welcomeMsg">Username <span>(Manager)</span></h2><p id="branchName" class="text-muted small mb-0"></p></div>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
            <img src="assets/icons/suppliers.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="main-content-body">
          
          <div class="filters-section">
            <h3 style="margin-bottom: 20px; color: #174e36;">Purchase Reports</h3>
            
            <div class="filters-row">
              <div class="filter-group">
                <label>Date Range</label>
                <div class="date-range">
                  <input type="date" id="startDate" class="form-control">
                  <span>to</span>
                  <input type="date" id="endDate" class="form-control">
                </div>
              </div>
              
              <div class="filter-group">
                <label>Supplier</label>
                <select id="supplierFilter" class="form-select">
                  <option value="all">All Suppliers</option>
                  <option value="s1">Farm Direct Ltd</option>
                  <option value="s2">Village Farmers Co.</option>
                </select>
              </div>

              <div class="filter-group">
                <label>Product</label>
                <select id="productFilter" class="form-select">
                  <option value="all">All Products</option>
                  <option value="beans">Beans</option>
                  <option value="maize">Maize</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Report Table -->
          <div class="table-section" style="padding: 0 25px;">
            <table class="clients-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Supplier</th>
                  <th>Product</th>
                  <th>Quantity</th>
                  <th>Total Cost</th>
                  <th>Delivery</th>
                  <th>Payment</th>
                </tr>
              </thead>
              <tbody id="reportTableBody">
                <!-- Data will be loaded dynamically -->
              </tbody>
            </table>
          </div>
          
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/sidebar-common.js"></script>
    <script src="js/purchase-reports.js"></script>
  </body>
</html>
