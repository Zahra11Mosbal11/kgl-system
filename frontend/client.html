<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clients</title>
    <link rel="stylesheet" href="styles/sales-agent-dashboard.css" />
    <link rel="stylesheet" href="styles/client.css" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- This is the manager dashboard page -->
    <div class="page">
      <div class="mobile-overlay" id="mobileOverlay"></div>
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <a href="sales-agent-dashboard.html" class="nav-item">
            <img src="assets/icons/Rectangle 2804.svg" alt="" />
            <span>Dashboard</span>
          </a>
          <a href="client.html" class="nav-item active">
            <img src="assets/icons/suppliers.svg" alt="" />
            <span>Clients</span>
          </a>
          <a href="sales-reports.html" class="nav-item">
            <img src="assets/icons/report.svg" alt="" />
            <span>Reports</span>
          </a>
          <div class="settings-logout">
            <a href="settings.html" class="nav-item">
              <img src="assets/icons/settings.svg" alt="" />
              <span>Settings</span></a
            >
            <a href="#" class="nav-item" id="logoutBtn">
              <img src="assets/icons/log_out.svg" alt="" />
              <span>Log Out</span></a
            >
          </div>
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="header-user-info">
            <h2 id="welcomeMsg">Username <span>(Sales Agent)</span></h2>
            <p id="branchName" class="text-muted small mb-0"></p>
          </div>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
            <img src="assets/icons/suppliers.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="main-content-body">
          <!--  Saerch Section -->

            <div class="tabal-header">
                <button
                class="gold-btn"
                style=" height: 50px;"
                onclick="fetchModal('modal/add-client.html')" 
              >
                Add New Client
              </button>
              
              <div class="filter-buttons">
                <input
                type="text"
                id="clientSearch"
                placeholder="Search..."
                class="search-input"
              />
                <button class="filter-btn active" data-filter="all">
                  All
                </button>
                <button class="filter-btn" data-filter="active">
                  Active
                </button>
                <button class="filter-btn" data-filter="credit">
                  Credit
                </button>
                <button class="filter-btn" data-filter="inactive">
                  Inactive
                </button>
              </div>
            
            </div>
            <!-- Clients Table Section -->
            <div class="table-section">
             

              <table class="clients-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Total Purchases</th>
                    <th>Phone</th>
                    <th>Credit</th>
                    <th>Status</th>
                    <th>Last Purchase</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody id="clientsTableBody">
                  <!-- Dynamic content will be injected here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="modal-container"></div>

    

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/client.js"></script>
  </body>
</html>
