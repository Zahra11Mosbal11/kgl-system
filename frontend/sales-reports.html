<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports</title>
    <link rel="stylesheet" href="styles/sales-agent-dashboard.css" />
    
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
          
          .filters-section {
        background: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      }
      
      .filters-row {
        display: flex;
        gap: 20px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      
      .filter-group {
        flex: 1;
        min-width: 200px;
      }
      
      .filter-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
      }
      
      .filter-group input,
      .filter-group select {
        width: 100%;
        padding: 10px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }
      
      .filter-group input:focus,
      .filter-group select:focus {
        outline: none;
        border-color: #dcaf48;
        box-shadow: 0 0 0 3px rgba(175, 155, 76, 0.1);
      }
      
      .date-range {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      
      .date-range input {
        flex: 1;
      }
      
      .filter-buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      
    </style>
  </head>
  <body>
    <!-- This is the manager dashboard page -->
    <div class="page">
      <div class="mobile-overlay" id="mobileOverlay"></div>
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <!-- Sidebar items will be injected by sidebar-common.js -->
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="header-user-info"><h2 id="welcomeMsg">Username <span>(Sales Agent)</span></h2><p id="branchName" class="text-muted small mb-0"></p></div>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
            <img src="assets/icons/suppliers.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="main-content-body">
          
          <div class="Overall" >
            <!-- Overall Sales header -->
                         <!-- Filters Section -->
                         <div class="filters-section" >
                          <h3 style="margin-bottom: 20px;">Sales Reports</h3>
                          
                          <div class="filters-row">
                            <div class="filter-group">
                              <label>Report Type</label>
                              <select id="reportType" class="form-select"  >
                                <option value="daily">Daily Report</option>
                                <option value="weekly" selected>Weekly Report</option>
                                <option value="monthly">Monthly Report</option>
                                <option value="yearly">Yearly Report</option>
                                <option value="custom">Custom Date Range</option>
                              </select>
                            </div>
                            
                            <div class="filter-group" id="dateRangeGroup" style="display: none;">
                              <label>Date Range</label>
                              <div class="date-range" >
                                <input type="date" id="startDate" class="form-control">
                                <span>to</span>
                                <input type="date" id="endDate" class="form-control">
                              </div>
                              <button class="gold-btn">
                                <i class="fas fa-chart-bar"></i> Generate Report
                              </button>
                            </div>
                            
                            <div class="filter-group">
                              <label>Branch (Optional)</label>
                              <select id="branchFilter" class="form-select"  >
                                <option value="all">All Branches</option>
                                <option value="Maganjo">Maganjo</option>
                                <option value="Matugga">Matugga</option>
                              </select>
                            </div>
                            
                            <div class="filter-group">
                              <label>Product (Optional)</label>
                              <select id="productFilter" class="form-select"  >
                                <option value="all">All Products</option>
                              </select>
                            </div>
                          </div>
            <!-- Overall Sales content -->
            <div class="Overall-content">
              <div
                class="Overall-content-unit"
                style="background-color: #e3f2fd"
              >
                <h4>Total Sales</h4>
                <p class="overall-value" id="totalSales">- UGX</p>
                <p class="overall-desc" id="quantityPeriod">Calculating...</p>
              </div>
              <div
                class="Overall-content-unit"
                style="background-color: #d4edda"
              >
                <h4 style="color: #155724">Cash Sales</h4>
                <p class="overall-value" id="cashSales">- UGX</p>
                <p class="overall-desc" id="cashPeriod">Calculating...</p>
              </div>
              <div
                class="Overall-content-unit"
                style="background-color: #fff3cd"
              >
                <h4 style="color: #856404">Credit Sales</h4>
                <p class="overall-value" id="creditSales">- UGX</p>
                <p class="overall-desc" id="creditPeriod">Calculating...</p>
              </div>
            </div>
          </div>
          <!-- Report Table -->
          <div class="table-section">
            <table class="clients-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Total Sold (kg)</th>
                  <th>Total Revenue</th>
                </tr>
              </thead>

              <tbody id="reportTableBody">
                <!-- Rows will be populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar-common.js"></script>
    <script src="js/sales-reports.js"></script>
        
  </body>
</html>
