<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales - Manager Dashboard</title>
    <link rel="stylesheet" href="styles/manager-dashboard.css" />
    <link rel="stylesheet" href="styles/client.css" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .sales-table-container {
        padding: 20px;
        background: white;
        margin: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <div class="page container-fluid">
      <div class="mobile-overlay" id="mobileOverlay"></div>
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <a href="manager-dashboard.html" class="nav-item">
            <img src="assets/icons/Rectangle 2804.svg" alt="" />
            <span>Dashboard</span>
          </a>
          <a href="manager-inventory.html" class="nav-item">
            <img src="assets/icons/inventory.svg" alt="" />
            <span>Inventory</span>
          </a>
          <a href="manager-sales.html" class="nav-item active">
            <img src="assets/icons/sales.svg" alt="" />
            <span>Sales</span>
          </a>
          <a href="manager-purchases.html" class="nav-item">
            <img src="assets/icons/checklist 1.svg" alt="" />
            <span>Purchases</span>
          </a>
          <a href="manager-suppliers.html" class="nav-item">
            <img src="assets/icons/suppliers.svg" alt="" />
            <span>Suppliers</span>
          </a>
          <a href="manager-reports.html" class="nav-item">
            <img src="assets/icons/report.svg" alt="" />
            <span>Reports</span>
          </a>
          <a href="director-user-management.html" class="nav-item">
            <img src="assets/icons/store.svg" alt="" />
            <span>User Management</span></a
          >
          <div class="settings-logout">
            <a href="settings.html" class="nav-item">
            <img src="assets/icons/settings.svg" alt="" />
            <span>Settings</span></a
          >
          <a href="#" class="nav-item" id="logoutBtn">
            <img src="assets/icons/log_out.svg" alt="" />
            <span>Log Out</span></a
          ></div>
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="header-user-info">
            <h2 id="welcomeMsg">User <span>(Role)</span></h2>
            <div class="d-flex align-items-center gap-2">
              <p id="branchName" class="text-muted small mb-0"></p>
              <select id="branchSelector" class="form-select form-select-sm" style="width: auto; display: none;">
                <option value="All">All Branches</option>
                <option value="Maganjo">Maganjo</option>
                <option value="Matugga">Matugga</option>
              </select>
            </div>
          </div>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
            <img src="assets/icons/suppliers.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="main-content-body">
          <div style="margin-top: 20px; margin-left: 40px;">
                    <h3 class="mb-0" style="color: #174e36;">Sales Records</h3>
                    
                </div>
            <div class="tabal-header d-flex align-items-center justify-content-between">
                <button
              class="gold-btn"
              style="height: 50px"
              onclick="fetchModal('modal/sales.html')"
            >
              Add New Sale
            </button>
                
                <div class="filter-buttons d-flex align-items-center">
                    <input type="text" id="salesSearch" placeholder="Search sale..." class="search-input" />
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="cash">Cash</button>
                    <button class="filter-btn" data-filter="credit">Credit</button>
                    <input type="date" class="filter-btn" style="padding: 4px;" />
                </div>
            </div>
            </div>

            <div class="sales-table-container loading">
                <table class="clients-table">
                    <thead>
                        <tr>
                            <th>Receipt ID</th>
                            <th>Date</th>
                            <th>Client Name</th>
                            <th>Product</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="salesTableBody">
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
      </div>
    </div>

    <div id="modal-container"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sales-form.js"></script>
    <script src="js/manager-sales.js"></script>
  </body>
</html>
