<div class="modal fade" id="addPurchasesModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-shopping-cart me-2"></i>Add New Procurement
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form id="procurementForm">
          <div id="formErrors" class="alert alert-danger d-none"></div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label">Supplier Name</label>
                <input type="text" id="supplierName" class="form-control" required>
              </div>
            </div>

            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label">Supplier Contact</label>
                <input type="tel" id="supplierContact" class="form-control" placeholder="e.g., 0712345678" required>
                <small class="text-muted">Must be exactly 10 digits</small>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label">Purchase Date</label>
                <input type="date" id="purchaseDate" class="form-control" required>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" id="ProductName" class="form-control" required>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-3">
              <div class="form-group mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" id="quantity" class="form-control" required>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-group mb-3">
                <label class="form-label">Unit Price (UGX)</label>
                <input type="number" id="price" step="0.01" class="form-control" required>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-group mb-3">
                <label class="form-label text-primary">Selling Price (UGX)</label>
                <input type="number" id="sellingPrice" step="0.01" class="form-control" required>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-group mb-3">
                <label class="form-label">Total Amount</label>
                <input type="number" id="total" class="form-control" readonly>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label d-block">Payment Method</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="payment_method" id="payCash" value="Cash">
                  <label class="form-check-label" for="payCash">Cash</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="payment_method" id="payMM" value="Mobile Money">
                  <label class="form-check-label" for="payMM">Mobile Money</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="payment_method" id="payBank" value="Bank Transfer">
                  <label class="form-check-label" for="payBank">Bank Transfer</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="payment_method" id="payCredit" value="Credit">
                  <label class="form-check-label" for="payCredit">Credit</label>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label d-block">Payment Status</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="payment_status" id="statusPaid" value="Paid">
                  <label class="form-check-label" for="statusPaid">Paid</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="payment_status" id="statusPending" value="Pending">
                  <label class="form-check-label" for="statusPending">Pending</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="payment_status" id="statusPartial" value="Partial">
                  <label class="form-check-label" for="statusPartial">Partial</label>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label">Delivery Date</label>
                <input type="date" id="deliveryDate" class="form-control" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label">Receipt Upload</label>
                <input type="file" id="receipt" class="form-control" accept="image/*">
              </div>
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label">Notes / Description</label>
            <textarea id="notes" class="form-control" rows="3"></textarea>
          </div>

          <p id="errorMsg" style="color: red; font-weight: bold"></p>

        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="procurementForm" class="gold-btn">
          <i class="fas fa-save me-2"></i>Submit Procurement
        </button>
      </div>

    </div>
  </div>
</div>
