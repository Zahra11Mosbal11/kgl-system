<!-- Edit Client Modal -->
<div class="modal fade client-modal" id="editClientModal" tabindex="-1" aria-labelledby="editClientModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editClientModalLabel">
          <i class="fas fa-edit me-2"></i>Edit Client
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form class="client-form" id="editClientForm">
          <input type="hidden" id="editClientId" name="id">
          <div id="editFormErrors" class="alert alert-danger d-none mb-3"></div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="editClientName">Full Name <span class="required">*</span></label>
                <input type="text" class="form-control" id="editClientName" name="name" placeholder="Enter client full name" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label for="editClientPhone">Phone Number <span class="required">*</span></label>
                <input type="tel" class="form-control" id="editClientPhone" name="contact" placeholder="07XXXXXXXX" minlength="10" maxlength="10" required>
              </div>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="editClientEmail">Email Address</label>
                <input type="email" class="form-control" id="editClientEmail" name="email" placeholder="client@example.com">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label for="editClientLocation">Location <span class="required">*</span></label>
                <input type="text" class="form-control" id="editClientLocation" name="location" placeholder="Enter client location" required>
              </div>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="editClientNIN">National ID (NIN)</label>
                <input type="text" class="form-control" id="editClientNIN" name="nationalId" placeholder="CM12345678ABCD9E">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label for="editClientType">Client Type</label>
                <select class="form-control" id="editClientType" name="type">
                  <option value="individual">Individual</option>
                  <option value="company">Company</option>
                  <option value="restaurant">Restaurant/Hotel</option>
                  <option value="wholesaler">Wholesaler</option>
                </select>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="editClientNotes">Notes</label>
            <textarea class="form-control" id="editClientNotes" name="notes" rows="3" placeholder="Any additional information about this client..."></textarea>
          </div>
          
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="editAllowCredit" name="allowCredit">
            <label class="form-check-label" for="editAllowCredit">
              Allow credit purchases for this client
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="editClientForm" class="gold-btn">
          <i class="fas fa-check me-2"></i>Update Client
        </button>
      </div>
    </div>
  </div>
</div>
