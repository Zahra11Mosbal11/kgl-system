<div class="modal fade" id="addSupplierModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background-color: #f8f9fa; border-bottom: 2px solid #dcaf48;">
                <h5 class="modal-title" style="color: #174e36; font-weight: bold;">Add New Supplier</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="supplierErrorMsg" class="alert alert-danger d-none" role="alert"></div>
                <form id="supplierForm">
                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 500;">Supplier Name</label>
                        <input type="text" id="supplierName" class="form-control" placeholder="Enter company or individual name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 500;">Contact Person</label>
                        <input type="text" id="contactPerson" class="form-control" placeholder="Enter name of primary contact" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 500;">Phone Number</label>
                        <input type="text" id="supplierContact" class="form-control" placeholder="e.g. 0700000000" required>
                        <small class="text-muted">Must be exactly 10 digits</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 500;">Location</label>
                        <input type="text" id="supplierLocation" class="form-control" placeholder="Enter city or district" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="background-color: #f8f9fa; border-top: 1px solid #dee2e6;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="supplierForm" class="btn btn-warning" style="background-color: #dcaf48; color: white; border: none; font-weight: 600; padding: 10px 25px;">Save Supplier</button>
            </div>
        </div>
    </div>
</div>
