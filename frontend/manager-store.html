<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Store - Manager Dashboard</title>
    <link rel="stylesheet" href="styles/manager-dashboard.css" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .store-management-container {
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      .management-section {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }
      .management-section h3 {
        color: #174e36;
        margin-bottom: 25px;
        border-bottom: 2px solid #dcaf48;
        display: inline-block;
        padding-bottom: 5px;
      }
      .store-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .management-btn {
        background-color: #dcaf48;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        transition: background 0.3s;
      }
      .management-btn:hover {
        background-color: #c99a38;
      }
    </style>
  </head>
  <body>
    <div class="page container-fluid">
      <div class="mobile-overlay" id="mobileOverlay"></div>
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <a href="manager-dashboard.html" class="nav-item">
            <img src="assets/icons/Rectangle 2804.svg" alt="" />
            <span>Dashboard</span>
          </a>
          <a href="manager-inventory.html" class="nav-item">
            <img src="assets/icons/inventory.svg" alt="" />
            <span>Inventory</span>
          </a>
          <a href="manager-sales.html" class="nav-item">
            <img src="assets/icons/sales.svg" alt="" />
            <span>Sales</span>
          </a>
          <a href="manager-purchases.html" class="nav-item">
            <img src="assets/icons/checklist 1.svg" alt="" />
            <span>Purchases</span>
          </a>
          <a href="manager-suppliers.html" class="nav-item">
            <img src="assets/icons/suppliers.svg" alt="" />
            <span>Suppliers</span>
          </a>
          <a href="manager-reports.html" class="nav-item">
            <img src="assets/icons/report.svg" alt="" />
            <span>Reports</span>
          </a>
          <a href="manager-store.html" class="nav-item active">
            <img src="assets/icons/store.svg" alt="" />
            <span>Manage Store</span></a
          >
          <div class="settings-logout">
            <a href="settings.html" class="nav-item">
            <img src="assets/icons/settings.svg" alt="" />
            <span>Settings</span></a
          >
          <a href="#" class="nav-item" id="logoutBtn">
            <img src="assets/icons/log_out.svg" alt="" />
            <span>Log Out</span></a
          ></div>
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="header-user-info"><h2 id="welcomeMsg">User <span>(Role)</span></h2><p id="branchName" class="text-muted small mb-0"></p></div>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
            <img src="assets/icons/suppliers.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="main-content-body">
            <div class="store-management-container loading">
                <div class="management-section">
                    <h3>Store Details</h3>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label class="form-label">Store Name</label>
                            <input type="text" class="form-control" value="Karibu Groceries Ltd - Main Branch" readonly>
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" value="Kampala, Uganda" readonly>
                        </div>
                    </div>
                </div>

                <div class="management-section">
                    <h3>Operating Hours</h3>
                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label class="form-label">Opening Time</label>
                            <input type="time" class="form-control" value="08:00">
                        </div>
                        <div class="col-md-4 form-group">
                            <label class="form-label">Closing Time</label>
                            <input type="time" class="form-control" value="18:00">
                        </div>
                        <div class="col-md-4 d-flex align-items-end form-group">
                            <button class="management-btn w-100">Update Hours</button>
                        </div>
                    </div>
                </div>

                <div class="management-section">
                    <h3>Product Categories</h3>
                    <div class="store-grid">
                        <!-- Data will be injected here -->
                        <button class="management-btn">+ Add Category</button>
                    </div>
                </div>
            </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = JSON.parse(localStorage.getItem("currentSession"));
        if (session) {
          const welcomeMsg = document.getElementById("welcomeMsg");
          welcomeMsg.innerHTML = `${session.username} <span>(${session.role})</span>`;
        const branchName = document.getElementById("branchName"); 
        if (branchName && session.branch) branchName.textContent = session.branch;        } else {
           window.location.href = "../index.html";
        }

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", (e) => {
                e.preventDefault();
                localStorage.removeItem("currentSession");
                window.location.href = "../index.html";
            });
        }

        // Remove loading state
        setTimeout(() => {
            document.querySelector('.store-management-container')?.classList.remove('loading');
        }, 500); // Small delay to simulate loading
      });
    </script>
  </body>
</html>
