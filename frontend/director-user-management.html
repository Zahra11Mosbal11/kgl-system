<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/manager-dashboard.css" />
    <title>User Management - Karibu Groceries</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/director-dashboard.css" />
  </head>
  <body>
    <div class="page container-fluid">
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <!-- Sidebar items will be injected by sidebar-common.js -->
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <h2 id="welcomeMsg">User Management <span>(Director)</span></h2>
          <div class="header-icons">
             <img src="assets/icons/bell.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="part1">
          <!-- User Summary Cards -->
           <button class="gold-btn"
            style="height: 50px" 
           onclick="fetchModal('modal/user.html')">
           Add New User
          </button>
            
          <div class="row mb-4 w-100" style="justify-content: center;">
            <div class="col-md-4">
              <div class="overview-card" id="totalEmployeesCard">
                <h3 class="card-title-custom">Total Employees</h3>
                <h2 class="card-value">0</h2>
                 <span class="text-muted small">0 Sales | 0 Managers | 0 Others</span>
              </div>
            </div>
            <div class="col-md-4">
              <div class="overview-card" id="activeSessionsCard">
                <h3 class="card-title-custom">Active Sessions</h3>
                <h2 class="card-value text-success">0</h2>
                <span class="text-muted small">Currently logged in</span>
              </div>
            </div>
          </div>

          <!-- User List Table -->
          <div class="low-stock-section w-100" style="background: white; border-radius: 12px; padding: 25px;">
             <div class="section-header">
                <h3>Staff Directory</h3>
                <div class="d-flex gap-2">
                   <input type="text" class="form-control form-control-sm" placeholder="Search staff...">
                   <select class="form-select form-select-sm">
                      <option>All Roles</option>
                      <option>Manager</option>
                      <option>Sales Agent</option>
                   </select>
                </div>
             </div>
             <table class="table table-hover mt-3">
                <thead>
                   <tr>
                      <th>Name</th>
                      <th>Role</th>
                      <th>Branch</th>
                      <th>Status</th>
                      <th>Actions</th>
                   </tr>
                </thead>
                <tbody id="userTableBody">
                   <!-- Dynamic content -->
                </tbody>
             </table>
          </div>
        </div>
      </div>
    </div>
    <div id="modal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar-common.js"></script>
    <script src="js/director-users.js"></script>
  </body>
</html>
