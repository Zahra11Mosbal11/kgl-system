<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/sales-agent-dashboard.css" />
    <title>Settings - KGL System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .settings-section {
        background: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      }
      .settings-section h3 {
        color: #174e36;
        margin-bottom: 20px;
        font-size: 18px;
        font-weight: 600;
        border-bottom: 2px solid #f0f0f0;
        padding-bottom: 10px;
      }
      .form-label {
        font-weight: 500;
        color: #333;
      }
      .btn-save {
        /* Legacy class kept for structure, but styles moved to .gold-btn in css */
      }
      .admin-only {
        display: none; /* Hidden by default, toggled via JS */
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="mobile-overlay" id="mobileOverlay"></div>
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <!-- Sidebar items will be injected by sidebar-common.js -->
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="header-user-info"><h2 id="welcomeMsg">Username <span>(Settings)</span></h2><p id="branchName" class="text-muted small mb-0"></p></div>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
            <img src="assets/icons/suppliers.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="main-content-body">
          
          <div class="container-fluid">
            <!-- Profile Settings -->
            <div class="settings-section">
              <h3>Profile Settings</h3>
              <form>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" value="John Doe" id="fullNameInput">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" value="john@kgl.com" readonly style="background-color: #f8f9fa;">
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" value="0771234567">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Role</label>
                    <input type="text" class="form-control" id="roleInput" value="Sales Agent" readonly style="background-color: #f8f9fa;">
                  </div>
                </div>
                <button type="submit" class="gold-btn">Update Profile</button>
              </form>
            </div>

            <!-- Security Settings -->
            <div class="settings-section">
              <h3>Security</h3>
              <form>
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label class="form-label">Current Password</label>
                    <input type="password" class="form-control">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control">
                  </div>
                </div>
                <button type="submit" class="gold-btn">Change Password</button>
              </form>
            </div>

            <!-- Admin Only Section -->
            <div class="settings-section admin-only" id="adminSettings">
              <h3>System Administration</h3>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <div class="card h-100 border-0 bg-light">
                    <div class="card-body">
                      <h5 class="card-title">User Management</h5>
                      <p class="card-text">Add, remove, or edit system users and their roles.</p>
                      <button class="btn btn-outline-dark btn-sm">Manage Users</button>
                    </div>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <div class="card h-100 border-0 bg-light">
                    <div class="card-body">
                      <h5 class="card-title">Branch Configuration</h5>
                      <p class="card-text">Update branch details and locations.</p>
                      <button class="btn btn-outline-dark btn-sm">Manage Branches</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>

        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar-common.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Auth Check
        const session = JSON.parse(localStorage.getItem("currentSession"));
        
        if (!session || !session.username) {
          window.location.href = "../index.html";
          return;
        }

        // Update UI with Session Data
        const welcomeMsg = document.getElementById("welcomeMsg");
        const fullNameInput = document.getElementById("fullNameInput");
        const roleInput = document.getElementById("roleInput");

        if (welcomeMsg) welcomeMsg.innerHTML = `${session.username} <span>(Settings)</span>`;
        const branchName = document.getElementById("branchName"); 
        if (branchName && session.branch) branchName.textContent = session.branch;        if (fullNameInput) fullNameInput.value = session.username; // Using username as name for now
        if (roleInput) roleInput.value = session.role;

        // Role-based logic for admin settings
        if (session.role === 'manager' || session.role === 'director' || session.role === 'Manager' || session.role === 'Director') {
          const adminSettings = document.getElementById('adminSettings');
          if (adminSettings) adminSettings.style.display = 'block';
        }
      });
    </script>
  </body>
</html>
