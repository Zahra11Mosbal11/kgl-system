<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/manager-dashboard.css" />
    <title>Credit Reports - Director</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/director-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="page container-fluid">
      <div class="mobile-overlay" id="mobileOverlay"></div>
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <a href="director-dashboard.html" class="nav-item">
            <img src="assets/icons/Rectangle 2804.svg" alt="" />
            <span>Dashboard</span>
          </a>
          <a href="director-procurement-reports.html" class="nav-item">
            <img src="assets/icons/report.svg" alt="" />
            <span>Procurement Reports</span>
          </a>
          <a href="director-sales-reports.html" class="nav-item">
            <img src="assets/icons/sales.svg" alt="" />
            <span>Sales Reports</span>
          </a>
          <a href="director-credit-reports.html" class="nav-item active">
            <img src="assets/icons/checklist 1.svg" alt="" />
            <span>Credit Reports</span>
          </a>
          <a href="director-stock-valuation.html" class="nav-item">
            <img src="assets/icons/store.svg" alt="" />
            <span>Stock Valuation</span>
          </a>
          <a href="director-user-management.html" class="nav-item">
            <img src="assets/icons/suppliers.svg" alt="" />
            <span>User Management</span>
          </a>
          <div class="settings-logout">
            <a href="#" class="nav-item">
              <img src="assets/icons/settings.svg" alt="" />
              <span>Settings</span></a
            >
            <a href="#" class="nav-item" id="logoutBtn">
              <img src="assets/icons/log_out.svg" alt="" />
              <span>Log Out</span></a
            >
          </div>
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="header-user-info"><h2 id="welcomeMsg">Credit Reports <span>(Director)</span></h2><p id="branchName" class="text-muted small mb-0"></p></div>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="part1">
          

          <!-- Credit Aging Chart -->
          <div class="row mb-4 w-100">
             <div class="col-md-12">
                <div class="chart-card" style="background: white; border-radius: 12px; padding: 25px; height: 350px;">
                   <h3>Credit Aging Analysis (Global)</h3>
                   <div style="height: 250px;">
                      <canvas id="creditAgingChart"></canvas>
                   </div>
                </div>
             </div>
          </div>

          <!-- Major Debtors Table -->
          <div class="low-stock-section w-100" style="background: white; border-radius: 12px; padding: 25px;">
             <div class="section-header">
                <h3>Major Outstanding Debts</h3>
             </div>
             <table class="table table-hover mt-3">
                <thead>
                   <tr>
                      <th>Client Name</th>
                      <th>Amount Due</th>
                      <th>Due Date</th>
                      <th>Branch</th>
                      <th>Action</th>
                   </tr>
                </thead>
                <tbody id="creditTableBody">
                    <tr><td colspan="5" class="text-center py-4">Loading credit records...</td></tr>
                </tbody>
             </table>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/director-credit.js"></script>
  </body>
</html>
