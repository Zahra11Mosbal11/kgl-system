<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/sales-agent-dashboard.css" />
    <title>Sales Agent Dashboard</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/director-dashboard.css" />
  </head>
  <body>
    <!-- This is the manager dashboard page -->
    <div class="page">
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <a href="#" class="nav-item active">
            <img src="assets/icons/Rectangle 2804.svg" alt="" />
            <span>Dashboard</span>
          </a>
          <a href="client.html" class="nav-item">
            <img src="assets/icons/suppliers.svg" alt="" />
            <span>Clients</span>
          </a>
          <a href="sales-reports.html" class="nav-item">
            <img src="assets/icons/report.svg" alt="" />
            <span>Reports</span>
          </a>
          <div class="settings-logout">
            <a href="settings.html" class="nav-item">
              <img src="assets/icons/settings.svg" alt="" />
              <span>Settings</span></a
            >
            <a href="#" class="nav-item" id="logoutBtn">
              <img src="assets/icons/log_out.svg" alt="" />
              <span>Log Out</span></a
            >
          </div>
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <div class="header-user-info"><h2 id="welcomeMsg">Username <span>(Sales Agent)</span></h2><p id="branchName" class="text-muted small mb-0"></p></div>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
            <img src="assets/icons/suppliers.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="main-content-body">
          <!-- Overall Sales Section -->
          <div class="Overall">
            <h3 class="mb-4" style="color: #155724;">Overall Sales</h3>
            <div class="row w-100">
              <div class="col-md-4">
                <div class="overview-card" style="margin-top: 0; background-color: #e3f2fd;">
                  <h3 class="card-title-custom">Total Sales</h3>
                  <h2 class="card-value" id="totalSalesVal">0 UGX</h2>
                  <span class="text-muted small">Last 7 days</span>
                </div>
              </div>
              <div class="col-md-4">
                <div class="overview-card" style="margin-top: 0; background-color: #d4edda;">
                  <h3 class="card-title-custom" style="color: #155724">Cash Sales</h3>
                  <h2 class="card-value" id="cashSalesVal">0 UGX</h2>
                  <span class="text-muted small">Last 7 days</span>
                </div>
              </div>
              <div class="col-md-4">
                <div class="overview-card" style="margin-top: 0; background-color: #fff3cd;">
                  <h3 class="card-title-custom" style="color: #856404">Credit Sales</h3>
                  <h2 class="card-value" id="creditSalesVal">0 UGX</h2>
                  <span class="text-muted small">Last 7 days</span>
                </div>
              </div>
            </div>
          </div>
          <!-- add new sales  -->
          <div class="add-search">
            <button
              class="gold-btn"
              style="height: 50px"
              onclick="fetchModal('modal/sales.html')"
            >
              Add New Sale
            </button>
            <!-- searsh and filter-->
            <div class="filter-buttons">
              <input
                type="text"
                id="salesSearch"
                placeholder="Search..."
                class="search-input"
              />
              <button class="sales-filter-btn active" data-filter="all">All</button>
              <button class=" sales-filter-btn" data-filter="cash">Cash</button>
              <button class=" sales-filter-btn" data-filter="credit">Credit</button>
            </div>
          </div>
          <!-- Table Section -->
          <div class="table-section">
            <div class="table-heder">
              <h3>Recent Sales</h3>
            </div>
            <div class="table-body">
              <table>
                <thead>
                  <tr>
                    <th>Sold ID</th>
                    <th>Products</th>
                    <th>Quantity</th>
                    <th>Sold Value</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="salesTableBody">
                  <!-- Dynamic content will be injected here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="modal-container"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sales-form.js"></script>
    <script src="js/sales.js"></script>
    <script>
      //Session management and logout handling 
      document.addEventListener("DOMContentLoaded", () => {
        const session = JSON.parse(localStorage.getItem("currentSession"));
        
        if (!session || !session.username) {
          window.location.href = "../index.html";
          return;
        }

        const welcomeMsg = document.getElementById("welcomeMsg");
        if (welcomeMsg) {
          welcomeMsg.innerHTML = `${session.username} <span>(${session.role})</span>`;
        const branchName = document.getElementById("branchName"); 
        if (branchName && session.branch) branchName.textContent = session.branch;        }

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", (e) => {
            e.preventDefault();
            localStorage.removeItem("currentSession");
            window.location.href = "../index.html";
          });
        }
      });
    </script>
  </body>
</html>
