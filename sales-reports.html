<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reports</title>
    <link rel="stylesheet" href="styles/sales-agent-dashboard.css" />
    
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
          
          .filters-section {
        background: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      }
      
      .filters-row {
        display: flex;
        gap: 20px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      
      .filter-group {
        flex: 1;
        min-width: 200px;
      }
      
      .filter-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
      }
      
      .filter-group input,
      .filter-group select {
        width: 100%;
        padding: 10px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }
      
      .filter-group input:focus,
      .filter-group select:focus {
        outline: none;
        border-color: #dcaf48;
        box-shadow: 0 0 0 3px rgba(175, 155, 76, 0.1);
      }
      
      .date-range {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      
      .date-range input {
        flex: 1;
      }
      
      .filter-buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      
    </style>
  </head>
  <body>
    <!-- This is the manager dashboard page -->
    <div class="page">
      <!-- Sidebar Section -->
      <div class="sidebar col">
        <div class="logo-dash">
          <img width="50" src="assets/images/KGL_logo.png" alt="" />
          <p>Karibu Groceries LTD</p>
        </div>
        <div class="nav-menu">
          <a href="sales-agent-dashboard.html" class="nav-item">
            <img src="assets/icons/Rectangle 2804.svg" alt="" />
            <span>Dashboard</span>
          </a>
          <a href="client.html" class="nav-item">
            <img src="assets/icons/suppliers.svg" alt="" />
            <span>Clients</span>
          </a>
          <a href="sales-reports.html" class="nav-item active">
            <img src="assets/icons/report.svg" alt="" />
            <span>Reports</span>
          </a>
          <div class="settings-logout">
            <a href="settings.html" class="nav-item">
              <img src="assets/icons/settings.svg" alt="" />
              <span>Settings</span></a
            >
            <a href="#" class="nav-item" id="logoutBtn">
              <img src="assets/icons/log_out.svg" alt="" />
              <span>Log Out</span></a
            >
          </div>
        </div>
      </div>
      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Header Section -->
        <div class="header">
          <h2 id="welcomeMsg">Username <span>(Sales Agent)</span></h2>
          <div class="header-icons">
            <img src="assets/icons/bell.svg" alt="" />
            <img src="assets/icons/suppliers.svg" alt="" />
          </div>
        </div>
        <!-- Content Section -->
        <div class="main-content-body">
          
          <div class="Overall" >
            <!-- Overall Sales header -->
                         <!-- Filters Section -->
                         <div class="filters-section" >
                          <h3 style="margin-bottom: 20px;">Sales Reports</h3>
                          
                          <div class="filters-row">
                            <div class="filter-group">
                              <label>Report Type</label>
                              <select id="reportType" class="form-select"  >
                                <option value="daily">Daily Report</option>
                                <option value="weekly" selected>Weekly Report</option>
                                <option value="monthly">Monthly Report</option>
                                <option value="yearly">Yearly Report</option>
                                <option value="custom">Custom Date Range</option>
                              </select>
                            </div>
                            
                            <div class="filter-group" id="dateRangeGroup" style="display: none;">
                              <label>Date Range</label>
                              <div class="date-range" >
                                <input type="date" id="startDate" class="form-control">
                                <span>to</span>
                                <input type="date" id="endDate" class="form-control">
                              </div>
                              <button class="gold-btn">
                                <i class="fas fa-chart-bar"></i> Generate Report
                              </button>
                            </div>
                            
                            <div class="filter-group">
                              <label>Branch (Optional)</label>
                              <select id="branchFilter" class="form-select"  >
                                <option value="all">All Branches</option>
                                <option value="branch1">Branch 1</option>
                                <option value="branch2">Branch 2</option>
                              </select>
                            </div>
                            
                            <div class="filter-group">
                              <label>Product (Optional)</label>
                              <select id="productFilter" class="form-select"  >
                                <option value="all">All Products</option>
                                <option value="beans">Beans</option>
                                <option value="maize">Grain Maize</option>
                                <option value="cowpeas">Cow peas</option>
                                <option value="gnuts">G-nuts</option>
                                <option value="soybeans">Soybeans</option>
                              </select>
                            </div>
                          </div>
            <!-- Overall Sales content -->
            <div class="Overall-content">
              <div
                class="Overall-content-unit"
                style="background-color: #e3f2fd"
              >
                <h4>Total Sales</h4>
                <p class="overall-value" id="totalSales">25,000UGX</p>
                <p class="overall-desc" id="quantityPeriod">Last 7 days</p>
              </div>
              <div
                class="Overall-content-unit"
                style="background-color: #d4edda"
              >
                <h4 style="color: #155724">Cash Sales</h4>
                <p class="overall-value" id="cashSales">20,000UGX</p>
                <p class="overall-desc" id="cashPeriod">Last 7 days</p>
              </div>
              <div
                class="Overall-content-unit"
                style="background-color: #fff3cd"
              >
                <h4 style="color: #856404">Credit Sales</h4>
                <p class="overall-value" id="creditSales">5,000UGX</p>
                <p class="overall-desc" id="creditPeriod">Last 7 days</p>
              </div>
            </div>
          </div>
          <!-- Report Table -->
          <div class="table-section">
            <table class="clients-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Total Sold (KG)</th>
                  <th>Total Revenue</th>
                </tr>
              </thead>

              <tbody id="reportTableBody">
                <!-- Rows will be populated by JS -->
              </tbody>
            </table>
          </div>
          <!-- Filters -->
          <div style="margin: 30px">
          <button class="gold-btn" style="height: 40px" onclick="generateReport()">
            Generate Report
          </button>          
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
      // Mock Data
      const salesData = [
        { id: 1, date: '2025-01-27', branch: 'branch1', product: 'beans', quantity: 100, price: 2000, type: 'cash' },
        { id: 2, date: '2025-01-26', branch: 'branch1', product: 'maize', quantity: 200, price: 1500, type: 'credit' },
        { id: 3, date: '2025-01-25', branch: 'branch2', product: 'soybeans', quantity: 150, price: 3000, type: 'cash' },
        { id: 4, date: '2025-01-20', branch: 'branch2', product: 'beans', quantity: 500, price: 2000, type: 'cash' },
        { id: 5, date: '2025-01-15', branch: 'branch1', product: 'cowpeas', quantity: 300, price: 2500, type: 'credit' },
        { id: 6, date: '2024-12-10', branch: 'branch1', product: 'gnuts', quantity: 100, price: 4000, type: 'cash' },
        { id: 7, date: '2025-01-27', branch: 'branch2', product: 'maize', quantity: 100, price: 1500, type: 'cash' },
        { id: 8, date: '2025-01-26', branch: 'branch1', product: 'beans', quantity: 50, price: 2000, type: 'credit' },
      ];

      document.addEventListener("DOMContentLoaded", () => {
        // Auth Check
        const session = JSON.parse(localStorage.getItem("currentSession"));
        
        if (!session || !session.username) {
          window.location.href = "index.html";
          return;
        }

        const welcomeMsg = document.getElementById("welcomeMsg");
        if (welcomeMsg) {
          welcomeMsg.innerHTML = `${session.username} <span>(${session.role})</span>`;
        }

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", (e) => {
            e.preventDefault();
            localStorage.removeItem("currentSession");
            window.location.href = "index.html";
          });
        }

        // --- Filter Logic ---
        
        // Toggle Date Range
        const reportType = document.getElementById('reportType');
        const dateRangeGroup = document.getElementById('dateRangeGroup');
        const branchFilterEl = document.getElementById('branchFilter');
        const productFilterEl = document.getElementById('productFilter');
        const startDateEl = document.getElementById('startDate');
        const endDateEl = document.getElementById('endDate');

        reportType.addEventListener('change', () => {
          if (reportType.value === 'custom') {
            dateRangeGroup.style.display = 'block';
          } else {
            dateRangeGroup.style.display = 'none';
            generateReport();
          }
        });

        if (branchFilterEl) branchFilterEl.addEventListener('change', generateReport);
        if (productFilterEl) productFilterEl.addEventListener('change', generateReport);
        if (startDateEl) startDateEl.addEventListener('change', generateReport);
        if (endDateEl) endDateEl.addEventListener('change', generateReport);
        const customGenerateBtn = document.querySelector('#dateRangeGroup .gold-btn');
        if (customGenerateBtn) customGenerateBtn.addEventListener('click', generateReport);

        // Initialize with default view
        generateReport();
      });

      function generateReport() {
        const type = document.getElementById('reportType').value;
        const branch = document.getElementById('branchFilter').value;
        const product = document.getElementById('productFilter').value;
        
        const today = new Date();
        let startDate, endDate;

        // Date Filtering Logic
        if (type === 'custom') {
          const start = document.getElementById('startDate').value;
          const end = document.getElementById('endDate').value;
          if (start && end) {
            startDate = new Date(start);
            endDate = new Date(end);
            // Include the entire end date
            endDate.setHours(23, 59, 59, 999);
          }
        } else {
          endDate = new Date();
          startDate = new Date();
          
          if (type === 'daily') {
            startDate.setHours(0, 0, 0, 0);
          } else if (type === 'weekly') {
            startDate.setDate(today.getDate() - 7);
          } else if (type === 'monthly') {
            startDate.setMonth(today.getMonth() - 1);
          } else if (type === 'yearly') {
            startDate.setFullYear(today.getFullYear() - 1);
          }
        }

        // Apply Filters
        const filteredData = salesData.filter(item => {
          const itemDate = new Date(item.date);
          const dateMatch = (!startDate || !endDate) ? true : (itemDate >= startDate && itemDate <= endDate);
          const branchMatch = (branch === 'all') || (item.branch === branch);
          const productMatch = (product === 'all') || (item.product === product);
          
          return dateMatch && branchMatch && productMatch;
        });

        // Calculate Stats
        let totalRevenue = 0;
        let cashRevenue = 0;
        let creditRevenue = 0;
        
        // Group by Product for Table
        const productStats = {};

        filteredData.forEach(item => {
          const revenue = item.quantity * item.price;
          totalRevenue += revenue;

          if (item.type === 'cash') {
            cashRevenue += revenue;
          } else {
            creditRevenue += revenue;
          }

          if (!productStats[item.product]) {
            productStats[item.product] = { quantity: 0, revenue: 0 };
          }
          productStats[item.product].quantity += item.quantity;
          productStats[item.product].revenue += revenue;
        });

        // Update UI Stats
        document.getElementById('totalSales').textContent = `${totalRevenue.toLocaleString()} UGX`;
        document.getElementById('cashSales').textContent = `${cashRevenue.toLocaleString()} UGX`;
        document.getElementById('creditSales').textContent = `${creditRevenue.toLocaleString()} UGX`;

        // Update Labels
        const label = type === 'custom' ? 'Custom Range' : 
                     (type === 'daily' ? 'Today' : 
                     (type === 'weekly' ? 'Last 7 Days' : 
                     (type === 'monthly' ? 'Last 30 Days' : 'Last Year')));
        
        document.getElementById('quantityPeriod').textContent = label;
        document.getElementById('cashPeriod').textContent = label;
        document.getElementById('creditPeriod').textContent = label;

        // Update Table
        const tableBody = document.getElementById('reportTableBody');
        tableBody.innerHTML = '';

        if (Object.keys(productStats).length === 0) {
            tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No records found for selected filters</td></tr>';
        } else {
            for (const [prodName, stats] of Object.entries(productStats)) {
            const row = `
                <tr>
                <td style="text-transform: capitalize;">${prodName}</td>
                <td>${stats.quantity.toLocaleString()} KG</td>
                <td>UGX ${stats.revenue.toLocaleString()}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
            }
        }
      }
  </script>
        
  </body>
</html>
